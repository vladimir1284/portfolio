name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly external-link sweep (Sun 06:00 UTC) — catches dead outbound URLs
    # that the per-PR internal gate intentionally skips.
    - cron: "0 6 * * 0"

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: lint + format check + astro check + build + INTERNAL link crawl.
  # Deterministic — safe to mark as a required check.
  verify:
    name: lint · types · build · internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads `packageManager` from package.json, so
      # CI runs the same pnpm as the working copy.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22 # satisfies package.json engines >=22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  # Non-blocking: also validates EXTERNAL links. External sites time out / rate-limit,
  # so this must NOT gate merges — it surfaces dead outbound URLs as a soft signal.
  # Runs on PRs (advisory) and on the weekly schedule.
  external-links:
    name: external links (non-blocking)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads `packageManager` from package.json, so
      # CI runs the same pnpm as the working copy.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm verify:links:full

  # Publish to Cloudflare Pages. Gated on `verify`, and on the same checkout
  # the gate ran against: the tree that passed is the tree that ships. Pages
  # deployments are atomic, so a cancelled run leaves the previous one serving.
  #
  # Needs two repository secrets:
  #   CLOUDFLARE_API_TOKEN   — token with `Cloudflare Pages: Edit` on the account
  #   CLOUDFLARE_ACCOUNT_ID  — `wrangler whoami` prints it
  deploy:
    name: deploy to Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://vladimir.ladetec.com
    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate
      # lives here instead: until both secrets exist the job reports a notice
      # and stops, rather than failing every push with a known-pending error.
      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish to Cloudflare Pages (see CLAUDE.md section 9)."
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'

      # No `version:` — the action reads `packageManager` from package.json, so
      # CI runs the same pnpm as the working copy.
      - name: Setup pnpm
        if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.creds.outputs.ready == 'true'
        run: pnpm build

      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        # v4 defaults to Wrangler v4 — no `wranglerVersion` pin, so this tracks
        # the same major the reindex script runs locally (`pnpm dlx wrangler@latest`).
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No `dist` here: wrangler.toml declares pages_build_output_dir. That
          # config also carries the `AI` binding /api/ask runs on — deploying
          # without it leaves the endpoint answering `unavailable`, which the
          # page degrades past, but silently.
          command: pages deploy --project-name=vladimir-portfolio --branch=master
